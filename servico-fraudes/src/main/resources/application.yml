server:
  port: 8085

spring:
  application:
    name: servico-fraudes
  datasource:
    url: jdbc:h2:mem:camunda-fraudes;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: servico-fraudes
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    auto-deployment-enabled: true
    history-time-to-live: P30D
    enforce-history-time-to-live: false

servico:
  extratos:
    url: ${SERVICO_EXTRATOS_URL:http://localhost:8083}
  notificacoes:
    url: ${SERVICO_NOTIFICACOES_URL:http://localhost:8084}
  camunda:
    url: ${SERVICO_CAMUNDA_URL:http://camunda:8080/engine-rest}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.banksystem: INFO
    org.camunda: WARN
  pattern:
    console: "%d{dd/MM/yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"