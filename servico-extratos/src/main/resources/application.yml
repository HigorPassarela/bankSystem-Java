server:
  port: 8083
spring:
  application:
    name: servico-extratos
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:senha123@localhost:27017/banksystem?authSource=admin}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: servico-extratos
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
jwt:
  secret: ${JWT_SECRET:banksystem-jwt-secret-chave-super-segura-2024}
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
logging:
  level:
    br.com.banksystem: INFO
