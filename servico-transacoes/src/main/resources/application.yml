server:
  port: 8082

spring:
  application:
    name: servico-transacoes
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:senha123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    properties:
      spring.json.trusted.packages: "*"

jwt:
  secret: ${JWT_SECRET:banksystem-jwt-secret-chave-super-segura-2024}

kafka:
  topicos:
    transacoes-aprovadas: transacoes-aprovadas
    transacoes-reprovadas: transacoes-reprovadas

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.banksystem: INFO

servico:
  contas:
    url: ${SERVICO_CONTAS_URL:http://localhost:8081}
