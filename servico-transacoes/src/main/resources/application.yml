server:
  port: 8082

spring:
  application:
    name: servico-transacoes
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:senha123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    properties:
      spring.json.trusted.packages: "*"
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:4200"
        - "http://localhost:8088"  # ← Específico para o frontend
        - "https://*.lovable.app"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

jwt:
  secret: ${JWT_SECRET:banksystem-jwt-secret-chave-super-segura-2024}

kafka:
  topicos:
    transacoes-aprovadas: transacoes-aprovadas
    transacoes-reprovadas: transacoes-reprovadas

servico:
  contas:
    url: ${SERVICO_CONTAS_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.banksystem: INFO
  pattern:
    console: "%d{dd/MM/yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"