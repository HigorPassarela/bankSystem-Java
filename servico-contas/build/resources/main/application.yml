server:
  port: 8081

spring:
  application:
    name: servico-contas
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:senha123@localhost:27017/banksystem?authSource=admin}
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:senha123}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

jwt:
  secret: ${JWT_SECRET:banksystem-jwt-secret-chave-super-segura-2024}
  expiracao: ${JWT_EXPIRACAO:86400000}

app:
  url-base: ${APP_URL_BASE:http://localhost:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.banksystem: INFO
  pattern:
    console: "%d{dd/MM/yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"